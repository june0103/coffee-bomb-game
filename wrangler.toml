name = "coffee-bomb-game"
main = "src/worker.js"
compatibility_date = "2025-01-01"
account_id = "b98c8546d9c49aeefa9648c497d80a88"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Weekly report batch. Cron is UTC — 08:00 Friday UTC is 17:00 Friday KST,
# so the report lands as the week wraps up rather than on Monday morning.
[triggers]
crons = ["0 8 * * 5"]

# Restaurant search is centred on the office so branch names don't get mixed up
# (searching "김밥천국" nationwide returns 마포, 울산, 송파 side by side).
# 서울 송파구 백제고분로37길 22
[vars]
OFFICE_LNG = "127.103999513024"
OFFICE_LAT = "37.5037054361453"
OFFICE_RADIUS_M = "800"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "Leaderboard"

[[durable_objects.bindings]]
name = "RESTAURANTS"
class_name = "Restaurants"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "Directory"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Leaderboard"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Restaurants"]
