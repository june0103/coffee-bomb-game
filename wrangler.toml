name = "coffee-bomb-game"
main = "src/worker.js"
compatibility_date = "2025-01-01"
account_id = "b98c8546d9c49aeefa9648c497d80a88"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "Leaderboard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "Directory"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Leaderboard"]
